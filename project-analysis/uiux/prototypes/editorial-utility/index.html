<!doctype html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SubscriptTrack — Editorial Utility</title><link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="prototype-controls" aria-label="Prototip kontrolleri">
    <label for="scenario">Senaryo</label>
    <select id="scenario"><option value="multiple">Birden fazla abonelik</option><option value="empty">Hiç abonelik yok</option><option value="single">Tek abonelik</option><option value="complete">Ödemeler tamam</option><option value="overdue">Gecikmiş ödeme</option><option value="trial">Deneme bitişi</option><option value="currencies">Birden fazla para birimi</option><option value="error">Ödeme geçmişi hatası</option><option value="offline">Çevrimdışı</option></select>
    <button id="theme" type="button" aria-label="Temayı değiştir">☼</button>
  </div>
  <div class="app">
    <header class="top"><div class="brand"><span class="brandmark" aria-hidden="true">s<span>·</span></span><span>subscript<span class="brand-light">track</span></span></div><button class="icon-button" id="notifications" type="button" aria-label="Bildirimler"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-2 7-2 9h16c0-2-2-2-2-9M10 20h4"/></svg></button></header>
    <main id="content"></main>
    <nav class="bottom" aria-label="Ana gezinme">
      <button class="nav-item active" type="button" data-nav="Ana Sayfa" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5.5 9.5V20h13V9.5M9.5 20v-6h5v6"/></svg><span>Ana Sayfa</span></button>
      <button class="nav-item" type="button" data-nav="Abonelikler"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span>Abonelikler</span></button>
      <button class="nav-item" type="button" data-nav="İstatistikler"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V4M19 20V8"/></svg><span>İstatistikler</span></button>
      <button class="nav-item" type="button" data-nav="Ayarlar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg><span>Ayarlar</span></button>
    </nav>
  </div>
  <dialog id="dialog"><div class="dialog-content"><h2 id="dialog-title"></h2><p id="dialog-copy"></p><button id="close-dialog" class="primary" type="button">Anladım</button></div></dialog>
  <script src="app.js"></script>
</body></html>
