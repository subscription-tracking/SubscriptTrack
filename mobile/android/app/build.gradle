plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// Güvenlik denetimi F-12: release derlemesi sessizce debug anahtarıyla
// imzalanmaz. Debug imza yalnızca ALLOW_DEBUG_SIGNING=true (ortam değişkeni) ya
// da -PallowDebugSigning=true ile açıkça istenirse kullanılır.
def allowDebugSigning = System.getenv('ALLOW_DEBUG_SIGNING') == 'true' ||
        project.hasProperty('allowDebugSigning')

gradle.taskGraph.whenReady { graph ->
    def releaseBuild = graph.allTasks.any {
        it.project == project && it.name.toLowerCase().contains('release') &&
                (it.name.startsWith('assemble') || it.name.startsWith('bundle') ||
                 it.name.startsWith('package') || it.name.startsWith('sign'))
    }
    if (releaseBuild && !keystorePropertiesFile.exists() && !allowDebugSigning) {
        throw new GradleException(
            'Release imza anahtarı yok: android/key.properties bulunamadı. ' +
            'Debug anahtarıyla bilinçli derleme için ALLOW_DEBUG_SIGNING=true ayarla.')
    }
}

android {
    namespace "com.subscripttrack.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions { jvmTarget = '21' }

    defaultConfig { applicationId "com.subscripttrack.app"; minSdk flutter.minSdkVersion; targetSdk flutter.targetSdkVersion; versionCode 1; versionName "0.1.0" }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            } else if (allowDebugSigning) {
                // Yalnızca bilinçli olarak açılırsa (CI doğrulama derlemesi, yerel
                // deneme): debug keystore. Bu çıktı Play Store'a yüklenemez.
                def debugKeystore = new File(System.getProperty("user.home") + "/.android/debug.keystore")
                storeFile debugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
            // key.properties yoksa ve izin verilmediyse imza tanımsız kalır;
            // aşağıdaki taskGraph koruması release derlemesini durdurur.
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            // flutter_local_notifications ikon adını runtime'da çözer;
            // resource shrinker bu dolaylı referansı görmediği için kapalı tutulur.
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

flutter { source '../..' }
