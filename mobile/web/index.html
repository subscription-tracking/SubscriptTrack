<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SubscriptTrack — Abonelik takip uygulaması">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SubscriptTrack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>SubscriptTrack</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #080912;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    /* Subtle radial glow behind phone */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(99,102,241,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    #phone-wrap {
      position: relative;
      flex-shrink: 0;
    }

    /* Outer phone body */
    #phone-frame {
      width: 393px;
      height: 852px;
      border-radius: 52px;
      background: #13141F;
      border: 1.5px solid rgba(255,255,255,0.10);
      box-shadow:
        0 0 0 6px #0E0F1A,
        0 0 0 7.5px rgba(255,255,255,0.05),
        0 50px 100px rgba(0,0,0,0.75),
        0 20px 40px rgba(0,0,0,0.5);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 14px;
    }

    /* Dynamic island */
    #dynamic-island {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 34px;
      background: #000;
      border-radius: 20px;
      z-index: 10;
      pointer-events: none;
    }

    /* Side buttons (left) */
    #phone-frame::before {
      content: '';
      position: absolute;
      left: -9px;
      top: 120px;
      width: 4px;
      height: 34px;
      background: #1E1F2E;
      border-radius: 2px 0 0 2px;
      box-shadow: 0 50px 0 #1E1F2E, 0 100px 0 #1E1F2E;
    }

    /* Power button (right) */
    #phone-frame::after {
      content: '';
      position: absolute;
      right: -9px;
      top: 170px;
      width: 4px;
      height: 68px;
      background: #1E1F2E;
      border-radius: 0 2px 2px 0;
    }

    /* Flutter app screen area */
    #flutter-target {
      width: 393px;
      height: 852px;
      border-radius: 48px;
      overflow: hidden;
      position: relative;
    }

    /* Screen glare */
    #screen-glare {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 240px;
      border-radius: 48px 48px 0 0;
      background: linear-gradient(160deg, rgba(255,255,255,0.04) 0%, transparent 60%);
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div id="phone-wrap">
    <div id="phone-frame">
      <div id="dynamic-island"></div>
      <div id="screen-glare"></div>
      <div id="flutter-target"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
