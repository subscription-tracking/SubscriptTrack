name: subscript_track
description: SubscriptTrack mobile subscription tracker.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  crypto: ^3.0.6
  go_router: ^18.0.2
  provider: ^6.1.2
  supabase_flutter: ^2.18.3
  share_plus: ^13.3.0
  path_provider: ^2.1.4
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  http: ^1.2.0
  font_awesome_flutter: ^11.0.0
  file_picker: ^13.1.0

dev_dependencies:
  share_plus_platform_interface: ^7.2.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk.ttf
