name: Docs check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'backend/migrations/**'
      - 'tools/docs/**'
      - '.github/workflows/docs-check.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'backend/migrations/**'
      - 'tools/docs/**'
      - '.github/workflows/docs-check.yml'

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Documentation consistency (links, versions, counts, migrations)
        run: python tools/docs/check_docs.py
