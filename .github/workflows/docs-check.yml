name: Docs check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'backend/migrations/**'
      - 'tools/docs/**'
      - '.github/workflows/docs-check.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'backend/migrations/**'
      - 'tools/docs/**'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Documentation consistency (links, versions, counts, migrations)
        run: python tools/docs/check_docs.py
