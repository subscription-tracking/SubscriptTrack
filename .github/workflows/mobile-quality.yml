name: Mobile quality gate

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-quality.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-quality.yml'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android-release-candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: analyze-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - name: Build unsigned Android App Bundle
        run: flutter build appbundle --release --dart-define=APP_VERSION=${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: subscripttrack-android-unsigned-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
