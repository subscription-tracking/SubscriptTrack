name: Mobile quality gate

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'backend/**'
      - '.github/workflows/mobile-quality.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'backend/**'
      - '.github/workflows/mobile-quality.yml'

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm test
      - name: Live Supabase smoke (when configured)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase secrets not configured; live smoke skipped."
          else
            npm run smoke:supabase
          fi

  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          flutter-version: '3.47.2'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded --timeout 2m

  android-release-candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: analyze-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Create debug keystore for CI signing
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          flutter-version: '3.47.2'
      - run: flutter pub get
      - name: Build unsigned Android App Bundle
        env:
          # CI yalnızca doğrulama derlemesi üretir; gerçek imza anahtarı yok (F-12).
          ALLOW_DEBUG_SIGNING: "true"
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols --dart-define=APP_VERSION=${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: subscripttrack-android-unsigned-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
      # Gizlenmiş çökme izlerini çözmek için sembol dosyaları (güvenlik denetimi F-22).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: subscripttrack-android-debug-symbols
          path: mobile/build/symbols
